[project]
name = "explorer"
version = "0.1.0"
description = "AI Codebase Explorer: parses a repo's code and git history into a queryable knowledge graph."
requires-python = ">=3.10"
dependencies = [
    "gitpython>=3.1",
    "click>=8.1",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
explorer = "explorer.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["explorer*"]
